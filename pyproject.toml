[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feei-aad"
version = "1.1.0"
description = "FEEI-Net and paired frontal-periauricular AAD benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
feei-train = "feei_aad.train:main"
feei-summarize = "feei_aad.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
